[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "llm-finetune-pipeline"
version = "0.1.0"
description = "End-to-end pipeline for fine-tuning, evaluating, and serving open-source code LLMs on consumer hardware"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dilber Shakir"}
]
keywords = ["llm", "fine-tuning", "lora", "qlora", "evaluation", "pytorch", "code-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "trl>=0.8.0",
    "tensorboard>=2.16.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "polars>=0.20.0",
    "datasketch>=1.6.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "evaluate>=0.4.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
serving = [
    "vllm>=0.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
finetune = "src.training.finetune:main"
evaluate-model = "src.evaluation.evaluate:main"
curate-data = "src.data.curate:main"
serve-model = "src.serving.server:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
